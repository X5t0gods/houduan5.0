[project]
name = "cssms-backend"
version = "1.0.0"
description = "中小型社区超市销售管理系统（CSSMS）后端服务 - 基于 FastAPI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    # Windows 上 ZoneInfo("Asia/Shanghai") 必须依赖 tzdata 提供的时区数据库；
    # Linux/Mac 有系统 tz 库，装了也无害，统一依赖避免平台差异
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI Depends() 在默认参数中使用是惯用写法

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
