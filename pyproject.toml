[project]
name = "cssms-backend"
version = "1.0.0"
description = "中小型社区超市销售管理系统（CSSMS）后端服务 - 基于 FastAPI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pymysql>=1.1.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    # 阶段 2 认证与权限：JWT 签发/解析 + 图形验证码
    # ⚠️ 不用 python-jose（依赖重、维护少）也不用 passlib（与 bcrypt>=4.0 不相容）
    "PyJWT>=2.9.0",
    "Pillow>=10.4.0",
    # 阶段 3 商品导入 Excel（仅 .xlsx）
    # ⚠️ 不装 pandas（阶段 9 BI 才需），也不装 xlrd（不支持 xlsx）
    "openpyxl>=3.1.0",
    # Windows 上 ZoneInfo("Asia/Shanghai") 必须依赖 tzdata 提供的时区数据库；
    # Linux/Mac 有系统 tz 库，装了也无害，统一依赖避免平台差异
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0",  # 防死锁无限挂（阶段 2 踩到 FK 死锁坑后新增）
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI Depends() 在默认参数中使用是惯用写法

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy 声明式模型：一行写完一个字段更可读（包含 mapped_column + 类型 + 约束 + comment），
# 强制拆行反而降低信息密度。社区惯例（包括 FastAPI 官方全栈模板）均对 models/ 目录宽容 E501。
"app/models/*.py" = ["E501"]
# Pydantic Schema 中文 description + Field(ge=/le=/max_length=) 多参数时自然很长，同理豁免
"app/schemas/product.py" = ["E501"]
"app/schemas/sale.py" = ["E501"]
# 测试文件：包含大量中文断言消息、测试数据字面量（如 Excel 行），自然很长，拆行反而失可读性
"tests/**/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: 需要真实数据库的集成测试（无数据库时自动 skip）",
]
# 默认超时 30 秒，防 FK 死锁或其他挂死（阶段 2 踩到）
timeout = 30
timeout_method = "thread"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
